[theme]
base = "dark"
primaryColor = "#6366f1"
backgroundColor = "#0a0e1a"
secondaryBackgroundColor = "#1e293b"
textColor = "#f1f5f9"
font = "sans-serif"

[server]
headless = true
port = 8501
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 10

[browser]
gatherUsageStats = false

[logger]
level = "info"